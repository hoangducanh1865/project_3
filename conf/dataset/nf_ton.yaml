# NF-ToN-IoT-v3 (src/netflow.py): benign và tấn công thu xen kẽ theo giờ, một đặc trưng đạt tối đa khoảng 0,85.
# Bảng chiến thuật do đề tài tự lập theo tên họ tấn công, chưa đối chiếu chuyên gia.
name: nf_ton
path: ${oc.env:NF_DIR,data}/nf_ton.csv
cache: ${oc.env:CACHE_DIR,/tmp}/nf_ton_cache.npz
label_col: label
benign: benign
drop_cols: [timestamp]
rare_threshold: 100
max_per_class: 100000
tactics:
  impact: [ddos, dos, ransomware]
  discovery: [scanning]
  credential_access: [password, mitm]
  initial_access: [xss, injection]
  command_and_control: [backdoor]
