# LYCOS-IDS2017 (Rosay 2022), tập dữ liệu của bài gốc CLOSR. Xem datasets/README.md.
name: lycos2017
path: ${oc.env:LYCOS_CSV,data/lycos.csv}
cache: ${oc.env:CACHE_DIR,/tmp}/lycos_cache.npz
label_col: label
benign: benign
drop_cols: [flow_id, src_addr, src_port, dst_addr, dst_port, ip_prot, timestamp]
rare_threshold: 100    # lớp ít hơn ngưỡng này là "zero-day", giống bài gốc CLOSR
max_per_class: 100000  # giới hạn số mẫu huấn luyện mỗi lớp
# Ánh xạ họ tấn công sang chiến thuật ATT&CK, bảng do đề tài tự lập, chưa đối chiếu chuyên gia.
# Mỗi mục khớp không phân biệt hoa thường với một phần tên lớp; lớp không khớp là benign.
stack_features: [hdr_len, tcp_init_win]   # cột chứa các chuỗi này phụ thuộc hệ điều hành và công cụ của máy gửi
tactics:
  impact: [dos, ddos]                      # T1498, T1499
  credential_access: [patator, bruteforce] # T1110
  initial_access: [sql, xss, heartbleed]   # T1190
  command_and_control: [bot]               # T1071
  discovery: [portscan]                    # T1046, T1595
